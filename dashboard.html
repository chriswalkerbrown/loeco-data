<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeteoA Station Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.35.0.min.js"></script>
<style>
  /* ── Reset & Base ─────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0b1120; --bg2: #111827; --bg3: #1a2332;
    --card: #151f2e; --card-hover: #1a2740;
    --border: #1e2d3d; --border-light: #2a3a4e;
    --text: #e2e8f0; --text-dim: #8899aa; --text-muted: #5a6a7a;
    --accent: #38bdf8; --accent2: #818cf8; --accent3: #34d399;
    --red: #f87171; --amber: #fbbf24; --green: #4ade80;
    --radius: 12px; --radius-sm: 8px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    line-height: 1.5; overflow-x: hidden;
    min-height: 100vh;
  }

  /* ── Layout ───────────────────────────────────────────── */
  .container { max-width: 1400px; margin: 0 auto; padding: 0 20px 40px; }

  /* ── Header ───────────────────────────────────────────── */
  .header {
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
    border-bottom: 1px solid var(--border);
    padding: 28px 0 24px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(12px);
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto; padding: 0 20px;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 12px;
  }
  .station-info { display: flex; align-items: center; gap: 16px; }
  .station-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; flex-shrink: 0;
  }
  .station-name { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }
  .station-meta { font-size: 0.82rem; color: var(--text-dim); margin-top: 2px; }
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 14px; border-radius: 20px; font-size: 0.78rem;
    font-weight: 600; letter-spacing: 0.02em;
  }
  .badge-live { background: rgba(74,222,128,0.12); color: var(--green); }
  .badge-warn { background: rgba(251,191,36,0.12); color: var(--amber); }
  .badge-stale { background: rgba(248,113,113,0.12); color: var(--red); }
  .badge-dot {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* ── WBGT Alert Banner ────────────────────────────────── */
  .wbgt-banner {
    margin-top: 20px; padding: 14px 20px; border-radius: var(--radius);
    display: none; align-items: center; gap: 12px; font-size: 0.9rem;
    font-weight: 500; border: 1px solid;
  }
  .wbgt-banner.safe    { background: rgba(74,222,128,0.06); border-color: rgba(74,222,128,0.2); color: var(--green); }
  .wbgt-banner.limited { background: rgba(251,191,36,0.06); border-color: rgba(251,191,36,0.2); color: var(--amber); }
  .wbgt-banner.caution { background: rgba(251,146,60,0.06); border-color: rgba(251,146,60,0.2); color: #fb923c; }
  .wbgt-banner.danger  { background: rgba(248,113,113,0.06); border-color: rgba(248,113,113,0.2); color: var(--red); }
  .wbgt-banner.extreme { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.3); color: #ef4444; }
  .wbgt-icon { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.04em; }

  /* ── Metric Cards ─────────────────────────────────────── */
  .metrics-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; margin-top: 24px;
  }
  .metric-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px 20px;
    transition: all 0.2s ease; position: relative; overflow: hidden;
    cursor: pointer;
  }
  .metric-card:hover { background: var(--card-hover); border-color: var(--border-light); transform: translateY(-2px); }
  .metric-card.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent), 0 4px 20px rgba(56,189,248,0.1); }
  .metric-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: var(--metric-color, var(--accent)); opacity: 0.7;
    border-radius: var(--radius) var(--radius) 0 0;
  }
  .metric-label {
    font-size: 0.75rem; color: var(--text-dim); font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .metric-label .icon { font-size: 0.9rem; }
  .metric-value-row { display: flex; align-items: baseline; gap: 8px; }
  .metric-value { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  .metric-unit { font-size: 0.85rem; color: var(--text-dim); font-weight: 400; }
  .metric-trend {
    display: flex; align-items: center; gap: 4px;
    font-size: 0.75rem; font-weight: 600; margin-top: 8px;
  }
  .trend-up { color: var(--red); }
  .trend-down { color: var(--accent); }
  .trend-stable { color: var(--text-muted); }
  .metric-range {
    font-size: 0.72rem; color: var(--text-muted); margin-top: 6px;
    display: flex; gap: 10px;
  }
  .metric-range span { display: flex; align-items: center; gap: 3px; }

  /* ── Chart Section ────────────────────────────────────── */
  .chart-section { margin-top: 28px; }
  .chart-panel {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden;
  }
  .chart-toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    flex-wrap: wrap; gap: 10px;
  }
  .chart-title { font-size: 0.95rem; font-weight: 600; }
  .range-btns { display: flex; gap: 4px; }
  .range-btn {
    padding: 5px 14px; border-radius: 6px; border: 1px solid var(--border);
    background: transparent; color: var(--text-dim); font-size: 0.78rem;
    font-weight: 600; cursor: pointer; transition: all 0.15s;
  }
  .range-btn:hover { border-color: var(--border-light); color: var(--text); }
  .range-btn.active { background: var(--accent); border-color: var(--accent); color: #0b1120; }
  .chart-wrap {
    height: 380px; overflow: hidden; position: relative;
    touch-action: pan-x pan-y;
  }
  .chart-wrap .js-plotly-plot { pointer-events: auto; }

  /* ── PNG Charts Grid ──────────────────────────────────── */
  .charts-grid-title {
    font-size: 1.1rem; font-weight: 600; margin-top: 36px; margin-bottom: 14px;
    color: var(--text); display: flex; align-items: center; gap: 8px;
  }
  .charts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
    gap: 14px;
  }
  .chart-image-card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: var(--radius); overflow: hidden; transition: all 0.2s;
  }
  .chart-image-card:hover { border-color: var(--border-light); transform: translateY(-1px); }
  .chart-image-card .card-header {
    padding: 12px 16px; font-size: 0.82rem; font-weight: 600;
    color: var(--text-dim); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .chart-image-card img {
    width: 100%; height: auto; display: block;
    background: #0d1525; image-rendering: auto;
  }

  /* ── Station Selector ─────────────────────────────────── */
  .station-select {
    background: var(--bg2); border: 1px solid var(--border);
    color: var(--text); padding: 7px 12px; border-radius: var(--radius-sm);
    font-size: 0.85rem; cursor: pointer; min-width: 180px;
  }
  .station-select:focus { outline: none; border-color: var(--accent); }

  /* ── Loading State ────────────────────────────────────── */
  .loading { display: flex; align-items: center; justify-content: center; padding: 60px; color: var(--text-dim); }
  .spinner {
    width: 28px; height: 28px; border: 3px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin-right: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Footer ───────────────────────────────────────────── */
  .footer {
    margin-top: 40px; padding: 20px 0; border-top: 1px solid var(--border);
    text-align: center; font-size: 0.78rem; color: var(--text-muted);
  }
  .footer a { color: var(--accent); text-decoration: none; }

  /* ── Responsive ───────────────────────────────────────── */
  @media (max-width: 768px) {
    .metrics-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .charts-grid { grid-template-columns: 1fr; }
    .metric-value { font-size: 1.5rem; }
    .chart-wrap { height: 300px; }
    .station-name { font-size: 1.1rem; }
    .header-inner { flex-direction: column; align-items: flex-start; }
  }
  @media (max-width: 480px) {
    .metrics-grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .metric-card { padding: 14px; }
    .metric-value { font-size: 1.3rem; }
  }
</style>
</head>
<body>

<!-- ═══ HEADER ═══ -->
<div class="header">
  <div class="header-inner">
    <div class="station-info">
      <div class="station-icon" style="font-size:15px;font-weight:700;color:#fff;letter-spacing:0.02em">M<span style="font-size:11px">A</span></div>
      <div>
        <div class="station-name" id="station-name">Loading...</div>
        <div class="station-meta" id="station-meta"></div>
      </div>
    </div>
    <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
      <select class="station-select" id="station-select" onchange="loadStation(this.value)">
        <option value="">Select station...</option>
      </select>
      <div class="badge badge-live" id="freshness-badge">
        <span class="badge-dot"></span> <span id="freshness-text">Loading</span>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <!-- ═══ WBGT ALERT ═══ -->
  <div class="wbgt-banner" id="wbgt-banner">
    <span class="wbgt-icon"></span>
    <span id="wbgt-text"></span>
  </div>

  <!-- ═══ METRIC CARDS ═══ -->
  <div class="metrics-grid" id="metrics-grid"></div>

  <!-- ═══ INTERACTIVE CHART ═══ -->
  <div class="chart-section">
    <div class="chart-panel">
      <div class="chart-toolbar">
        <div class="chart-title" id="chart-title">Temperature</div>
        <div class="range-btns">
          <button class="range-btn active" onclick="setRange(24, this)">24H</button>
          <button class="range-btn" onclick="setRange(72, this)">3D</button>
          <button class="range-btn" onclick="setRange(168, this)">7D</button>
        </div>
      </div>
      <div class="chart-wrap" id="chart-wrap">
        <div class="loading"><div class="spinner"></div> Loading chart data...</div>
      </div>
    </div>
  </div>

  <!-- ═══ PRE-RENDERED CHARTS ═══ -->
  <div class="charts-grid-title">7-Day Overviews</div>
  <div class="charts-grid" id="charts-grid"></div>

  <!-- ═══ FOOTER ═══ -->
  <div class="footer">
    Data updated every 10 minutes &middot; Powered by <a href="https://meteoa.com">MeteoA</a> &middot; &copy; 2026
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════
   CONFIGURATION
   ═══════════════════════════════════════════════════════════ */
const BASE = location.origin;
const DEFAULT_STATION = new URLSearchParams(location.search).get('station') || location.pathname.match(/\/stations\/([^\/]+)/)?.[1] || 'EUX004_EOC';

/* Metric display config: key -> label, unit, color, format */
const METRIC_DEFS = {
  temperature_c:   { label: 'Temperature',     unit: '\u00b0C',    color: '#ff6b6b', fmt: v => v?.toFixed(1) },
  humidity_pct:    { label: 'Humidity',         unit: '%',     color: '#38bdf8', fmt: v => v?.toFixed(0) },
  pressure_hpa:    { label: 'Pressure',         unit: 'hPa',   color: '#818cf8', fmt: v => v?.toFixed(1) },
  wind_speed_ms:   { label: 'Wind Speed',       unit: 'm/s',   color: '#34d399', fmt: v => v?.toFixed(1) },
  rain_rate_mmhr:  { label: 'Rain Rate',        unit: 'mm/hr', color: '#60a5fa', fmt: v => v?.toFixed(1) },
  solar_wm2:       { label: 'Solar Radiation',  unit: 'W/m\u00b2',  color: '#fbbf24', fmt: v => v?.toFixed(0) },
  wbgt_c:          { label: 'WBGT',             unit: '\u00b0C',    color: '#f97316', fmt: v => v?.toFixed(1) },
  dew_point_c:     { label: 'Dew Point',        unit: '\u00b0C',    color: '#a78bfa', fmt: v => v?.toFixed(1) },
  feels_like_c:    { label: 'Feels Like',       unit: '\u00b0C',    color: '#fb7185', fmt: v => v?.toFixed(1) },
  wind_gust_ms:    { label: 'Wind Gust',        unit: 'm/s',   color: '#2dd4bf', fmt: v => v?.toFixed(1) },
  wind_dir_deg:    { label: 'Wind Direction',    unit: '\u00b0',     color: '#94a3b8', fmt: v => v?.toFixed(0) },
  rain_daily_mm:   { label: 'Daily Rain',       unit: 'mm',    color: '#3b82f6', fmt: v => v?.toFixed(1) },
  globe_temp_c:    { label: 'Globe Temp',        unit: '\u00b0C',    color: '#e879f9', fmt: v => v?.toFixed(1) },
};

/* Which metrics to show as primary cards (top row) */
const PRIMARY_METRICS = [
  'temperature_c', 'humidity_pct', 'pressure_hpa', 'wind_speed_ms',
  'rain_rate_mmhr', 'solar_wm2', 'wbgt_c', 'feels_like_c'
];

/* PNG chart images to display */
const CHART_IMAGES = [
  { key: 'combined_overview_latest.png', label: 'Combined Overview' },
  { key: 'temperature_c_latest.png', label: 'Temperature' },
  { key: 'humidity_pct_latest.png', label: 'Humidity' },
  { key: 'pressure_hpa_latest.png', label: 'Pressure' },
  { key: 'wind_speed_ms_latest.png', label: 'Wind Speed' },
  { key: 'wind_gust_ms_latest.png', label: 'Wind Gust' },
  { key: 'wind_dir_deg_latest.png', label: 'Wind Direction' },
  { key: 'solar_wm2_latest.png', label: 'Solar Radiation' },
  { key: 'rain_daily_mm_latest.png', label: 'Daily Rain' },
  { key: 'rain_rate_mmhr_latest.png', label: 'Rain Rate' },
  { key: 'dew_point_c_latest.png', label: 'Dew Point' },
  { key: 'feels_like_c_latest.png', label: 'Feels Like' },
  { key: 'wbgt_c_latest.png', label: 'WBGT Heat Stress' },
  { key: 'globe_temp_c_latest.png', label: 'Globe Temperature' },
];

/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
let statsData = null;
let chartData = null;
let activeMetric = 'temperature_c';
let currentRange = 24;
let currentStation = DEFAULT_STATION;

/* ═══════════════════════════════════════════════════════════
   STATION SELECTOR
   ═══════════════════════════════════════════════════════════ */
async function loadStationList() {
  try {
    const res = await fetch(`${BASE}/stations_summary.json`);
    const data = await res.json();
    const sel = document.getElementById('station-select');
    const stations = Array.isArray(data) ? data : (data.stations || []);
    stations.sort((a, b) => (a.name || a.station || '').localeCompare(b.name || b.station || ''));
    stations.forEach(s => {
      const id = s.station || s.id || s.name;
      const label = (s.name || id).replace(/_/g, ' ');
      const opt = document.createElement('option');
      opt.value = id; opt.textContent = label;
      if (id === currentStation) opt.selected = true;
      sel.appendChild(opt);
    });
  } catch (e) { console.warn('Could not load station list:', e); }
}

function loadStation(id) {
  if (!id) return;
  currentStation = id;
  const url = new URL(location.href);
  url.searchParams.set('station', id);
  history.replaceState(null, '', url);
  init();
}

/* ═══════════════════════════════════════════════════════════
   DATA LOADING
   ═══════════════════════════════════════════════════════════ */
async function fetchStats() {
  const res = await fetch(`${BASE}/stations/${currentStation}/statistics.json`);
  return res.json();
}

async function fetchChartData() {
  const res = await fetch(`${BASE}/stations/${currentStation}/chart_data.json`);
  return res.json();
}

/* ═══════════════════════════════════════════════════════════
   FRESHNESS BADGE
   ═══════════════════════════════════════════════════════════ */
function updateFreshness(generated_utc) {
  const badge = document.getElementById('freshness-badge');
  const text = document.getElementById('freshness-text');
  if (!generated_utc) { text.textContent = 'Unknown'; return; }

  const gen = new Date(generated_utc.replace(' UTC', 'Z').replace(' ', 'T'));
  const ageMin = (Date.now() - gen.getTime()) / 60000;

  badge.className = 'badge';
  if (ageMin < 30) {
    badge.classList.add('badge-live');
    text.textContent = `Live \u00b7 ${Math.round(ageMin)}m ago`;
  } else if (ageMin < 120) {
    badge.classList.add('badge-warn');
    text.textContent = `${Math.round(ageMin)}m ago`;
  } else {
    badge.classList.add('badge-stale');
    const hrs = Math.round(ageMin / 60);
    text.textContent = `Stale \u00b7 ${hrs}h ago`;
  }
}

/* ═══════════════════════════════════════════════════════════
   WBGT ALERT
   ═══════════════════════════════════════════════════════════ */
function updateWBGT(metrics) {
  const banner = document.getElementById('wbgt-banner');
  const wbgt = metrics?.wbgt_c?.latest;
  if (wbgt == null) { banner.style.display = 'none'; return; }

  let level, label, icon;
  if (wbgt < 21)      { level = 'safe';    label = 'Safe \u2014 No heat stress risk'; icon = 'OK'; }
  else if (wbgt < 26) { level = 'limited'; label = `Limited risk \u2014 WBGT ${wbgt.toFixed(1)}\u00b0C`; icon = '!'; }
  else if (wbgt < 29) { level = 'caution'; label = `Caution \u2014 WBGT ${wbgt.toFixed(1)}\u00b0C \u2014 Reduce heavy outdoor work`; icon = '!!'; }
  else if (wbgt < 32) { level = 'danger';  label = `Danger \u2014 WBGT ${wbgt.toFixed(1)}\u00b0C \u2014 Limit outdoor exposure`; icon = '!!!'; }
  else                { level = 'extreme'; label = `Extreme \u2014 WBGT ${wbgt.toFixed(1)}\u00b0C \u2014 Stop all outdoor activity`; icon = 'ALERT'; }

  banner.className = `wbgt-banner ${level}`;
  banner.style.display = 'flex';
  document.querySelector('.wbgt-icon').textContent = icon;
  document.getElementById('wbgt-text').textContent = label;
}

/* ═══════════════════════════════════════════════════════════
   METRIC CARDS
   ═══════════════════════════════════════════════════════════ */
function renderMetrics(metrics) {
  const grid = document.getElementById('metrics-grid');
  grid.innerHTML = '';

  const available = PRIMARY_METRICS.filter(k => metrics[k]?.latest != null);

  available.forEach(key => {
    const m = metrics[key];
    const def = METRIC_DEFS[key] || {};
    const val = def.fmt ? def.fmt(m.latest) : m.latest;

    const trendClass = m.trend === 'up' ? 'trend-up' : m.trend === 'down' ? 'trend-down' : 'trend-stable';
    const trendArrow = m.trend === 'up' ? '\u2191' : m.trend === 'down' ? '\u2193' : '\u2192';
    const trendVal = m.trend_value != null ? Math.abs(m.trend_value).toFixed(1) : '';

    const card = document.createElement('div');
    card.className = `metric-card${key === activeMetric ? ' active' : ''}`;
    card.style.setProperty('--metric-color', def.color || '#38bdf8');
    card.onclick = () => selectMetric(key);
    card.innerHTML = `
      <div class="metric-label">${def.label || m.label || key}</div>
      <div class="metric-value-row">
        <span class="metric-value">${val ?? '\u2014'}</span>
        <span class="metric-unit">${def.unit || m.unit || ''}</span>
      </div>
      <div class="metric-trend ${trendClass}">${trendArrow} ${trendVal} ${def.unit || m.unit || ''} (7d trend)</div>
      <div class="metric-range">
        <span>\u25bc ${def.fmt ? def.fmt(m.min) : m.min}</span>
        <span>\u25b2 ${def.fmt ? def.fmt(m.max) : m.max}</span>
        <span>\u03bc ${def.fmt ? def.fmt(m.mean) : m.mean}</span>
      </div>
    `;
    grid.appendChild(card);
  });
}

function selectMetric(key) {
  activeMetric = key;
  document.querySelectorAll('.metric-card').forEach((c, i) => {
    const k = PRIMARY_METRICS.filter(k => statsData?.metrics?.[k]?.latest != null)[i];
    c.classList.toggle('active', k === key);
  });
  renderChart();
}

/* ═══════════════════════════════════════════════════════════
   INTERACTIVE PLOTLY CHART
   ═══════════════════════════════════════════════════════════ */
function computeRollingAvg(values, timestamps, windowMs) {
  const result = new Array(values.length);
  const times = timestamps.map(t => new Date(t).getTime());
  for (let i = 0; i < values.length; i++) {
    if (values[i] == null) { result[i] = null; continue; }
    let sum = 0, count = 0;
    for (let j = i; j >= 0; j--) {
      if (times[i] - times[j] > windowMs) break;
      if (values[j] != null) { sum += values[j]; count++; }
    }
    result[i] = count > 0 ? sum / count : null;
  }
  return result;
}

function renderChart() {
  const wrap = document.getElementById('chart-wrap');
  const data = chartData?.[activeMetric];
  const def = METRIC_DEFS[activeMetric] || {};

  document.getElementById('chart-title').textContent = `${def.label || activeMetric} \u2014 Interactive`;

  if (!data?.timestamps?.length) {
    wrap.innerHTML = '<div class="loading">No chart data available for this metric</div>';
    return;
  }

  const cutoff = new Date(Date.now() - currentRange * 3600000);
  const indices = [];
  for (let i = 0; i < data.timestamps.length; i++) {
    if (new Date(data.timestamps[i]) >= cutoff) indices.push(i);
  }

  const ts = indices.map(i => data.timestamps[i]);
  const raw = indices.map(i => data.raw[i]);
  const avg3h = computeRollingAvg(raw, ts, 3 * 3600000);

  const rawTrace = {
    x: ts, y: raw, type: 'scattergl', mode: 'lines',
    name: 'Raw (5min)',
    line: { color: def.color || '#38bdf8', width: 1, shape: 'spline' },
    opacity: 0.5,
    hovertemplate: `%{y:.1f} ${def.unit || ''}<extra>Raw</extra>`,
  };
  const avgTrace = {
    x: ts, y: avg3h, type: 'scattergl', mode: 'lines',
    name: '3h Average',
    line: { color: def.color || '#38bdf8', width: 2.5, shape: 'spline' },
    hovertemplate: `%{y:.1f} ${def.unit || ''}<extra>3h Avg</extra>`,
  };

  const layout = {
    paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
    margin: { l: 55, r: 20, t: 10, b: 40 },
    font: { family: '-apple-system, Inter, sans-serif', color: '#8899aa', size: 12 },
    xaxis: {
      gridcolor: '#1e2d3d', gridwidth: 1,
      tickformat: currentRange <= 24 ? '%H:%M' : '%b %d %H:%M',
      fixedrange: true,
    },
    yaxis: {
      gridcolor: '#1e2d3d', gridwidth: 1,
      title: { text: def.unit || '', standoff: 10 },
      fixedrange: true,
    },
    legend: { x: 0, y: 1.05, orientation: 'h', font: { size: 11 } },
    hovermode: 'x unified',
    hoverlabel: { bgcolor: '#1a2332', bordercolor: '#2a3a4e', font: { color: '#e2e8f0' } },
  };

  const config = {
    responsive: true, displayModeBar: false,
    scrollZoom: false, staticPlot: false,
  };

  Plotly.react(wrap, [rawTrace, avgTrace], layout, config);
}

function setRange(hours, btn) {
  currentRange = hours;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderChart();
}

/* ═══════════════════════════════════════════════════════════
   PNG CHART IMAGES
   ═══════════════════════════════════════════════════════════ */
function renderChartImages() {
  const grid = document.getElementById('charts-grid');
  grid.innerHTML = '';
  CHART_IMAGES.forEach(img => {
    const url = `${BASE}/stations/${currentStation}/${img.key}`;
    const card = document.createElement('div');
    card.className = 'chart-image-card';
    card.innerHTML = `
      <div class="card-header">${img.label}</div>
      <img src="${url}" alt="${img.label}" loading="lazy" onerror="this.parentElement.style.display='none'">
    `;
    grid.appendChild(card);
  });
}

/* ═══════════════════════════════════════════════════════════
   INIT
   ═══════════════════════════════════════════════════════════ */
async function init() {
  const name = currentStation.replace(/_/g, ' ');
  document.getElementById('station-name').textContent = name;
  document.getElementById('station-meta').textContent = 'Loading data...';
  document.title = `${name} \u2014 MeteoA Dashboard`;

  try {
    const [stats, charts] = await Promise.all([fetchStats(), fetchChartData()]);
    statsData = stats;
    chartData = charts;

    const m = stats.metrics || {};
    const dateRange = stats.date_range || {};

    document.getElementById('station-meta').textContent =
      `${stats.record_count || '\u2014'} records \u00b7 ${stats.window_days || 7}-day window \u00b7 ${dateRange.start || ''} \u2192 ${dateRange.end || ''}`;

    updateFreshness(stats.generated_utc);
    updateWBGT(m);
    renderMetrics(m);

    // Auto-select first available metric if current isn't available
    if (!m[activeMetric]?.latest) {
      const first = PRIMARY_METRICS.find(k => m[k]?.latest != null);
      if (first) activeMetric = first;
    }
    renderChart();
    renderChartImages();

  } catch (err) {
    console.error('Failed to load station data:', err);
    document.getElementById('station-meta').textContent = 'Error loading data';
    document.getElementById('chart-wrap').innerHTML =
      `<div class="loading" style="color:var(--red)">Failed to load data. Check console for details.</div>`;
  }
}

/* Boot */
loadStationList();
init();
</script>
