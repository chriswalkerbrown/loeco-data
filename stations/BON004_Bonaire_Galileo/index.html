<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoEco — Station Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg-primary:#0a0a1a;--bg-secondary:#111128;--bg-card:#161637;--border:#252555;--text-primary:#e8e8f0;--text-muted:#8888aa;--text-dim:#555577;--accent-blue:#45b7d1;--accent-green:#4ecdc4;--accent-red:#ff6b6b;--radius:12px;--radius-sm:8px; }
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;line-height:1.5}
    body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(69,183,209,.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(78,205,196,.03) 0%,transparent 50%);pointer-events:none;z-index:0}
    .header{position:relative;z-index:1;background:var(--bg-secondary);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}
    .header-left{display:flex;align-items:center;gap:1rem}
    .logo-badge{background:linear-gradient(135deg,var(--accent-blue),var(--accent-green));color:#000;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.7rem;letter-spacing:.12em;padding:.3rem .65rem;border-radius:6px;text-transform:uppercase}
    .nav-breadcrumb{font-family:'Inter',sans-serif;font-size:.9rem;font-weight:500;color:var(--text-primary)}
    .nav-breadcrumb a{color:var(--accent-blue);text-decoration:none;transition:opacity .2s}
    .nav-breadcrumb a:hover{opacity:.7}
    .nav-breadcrumb span{color:var(--text-muted);margin:0 .4rem}
    .header-right{display:flex;align-items:center;gap:1rem;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:.75rem}
    .time-range-toggle{display:flex;gap:.2rem;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:.3rem}
    .time-range-toggle button{padding:.3rem .8rem;border:none;background:transparent;color:var(--text-muted);font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:600;cursor:pointer;border-radius:4px;transition:all .2s;text-transform:uppercase;letter-spacing:.04em}
    .time-range-toggle button:hover{color:var(--text-primary)}
    .time-range-toggle button.active{background:linear-gradient(135deg,var(--accent-blue),var(--accent-green));color:#000;font-weight:700}
    .stale-data-banner{position:relative;z-index:1;background:var(--bg-secondary);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:.6rem 2rem;display:none;align-items:center;font-family:'Inter',sans-serif;font-size:.85rem;color:var(--text-muted);gap:.8rem}
    .stale-data-banner.active{display:flex}
    .stale-data-banner.warning{background:rgba(249,202,36,.08);border-top-color:#f9ca24;border-bottom-color:#f9ca24;color:#f9ca24}
    .stale-data-banner.critical{background:rgba(255,107,107,.08);border-top-color:var(--accent-red);border-bottom-color:var(--accent-red);color:var(--accent-red)}
    .container{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:2rem}
    .metrics-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;margin-bottom:2rem}
    .metric-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;transition:all .3s ease}
    .metric-card:hover{border-color:var(--accent-blue);box-shadow:0 0 20px rgba(69,183,209,.15)}
    .metric-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:.8rem}
    .metric-label{display:flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em}
    .metric-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--accent-green)}
    .metric-value{font-family:'JetBrains Mono',monospace;font-size:2.2rem;font-weight:700;color:var(--text-primary);line-height:1;margin-bottom:.4rem}
    .metric-unit{font-size:.9rem;color:var(--text-muted);font-weight:400;margin-left:.3rem}
    .wbgt-flag{display:inline-block;padding:.35rem .75rem;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-top:.5rem;color:#000}
    .wbgt-flag.safe{background:#4ecdc4}.wbgt-flag.limited{background:#f9ca24}.wbgt-flag.caution{background:#ff9800}.wbgt-flag.danger{background:#ff6b6b}.wbgt-flag.extreme{background:#e74c3c;color:#fff}
    .chart-section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:2rem;margin-bottom:2rem}
    .chart-section h2{font-size:1.1rem;font-weight:600;margin-bottom:1.5rem;color:var(--text-primary)}
    #chart{width:100%;height:400px}
    .footer{position:relative;z-index:1;text-align:center;padding:2rem;font-size:.75rem;color:var(--text-dim);border-top:1px solid var(--border);margin-top:4rem}
    .footer a{color:var(--accent-blue);text-decoration:none}
    .footer a:hover{opacity:.7}
  </style>
</head>
<body>
  <div class="stale-data-banner" id="stale-banner"><span class="icon">⚠</span><span class="message" id="stale-message">No data for 90+ minutes</span></div>
  <header class="header">
    <div class="header-left"><div class="logo-badge">LoEco</div><nav class="nav-breadcrumb"><a href="../../index.html">Dashboard</a><span>›</span><span id="station-name">—</span></nav></div>
    <div class="header-right"><div class="time-range-toggle"><button class="btn-range active" data-range="24h">24H</button><button class="btn-range" data-range="3d">3D</button><button class="btn-range" data-range="7d">7D</button></div><span class="last-update" id="last-update">Updated: —</span></div>
  </header>
  <div class="container">
    <div class="metrics-grid" id="metrics-grid"></div>
    <div class="chart-section"><h2>Temperature Trend (Selected Range)</h2><canvas id="chart"></canvas></div>
  </div>
  <footer class="footer">LoEco Weather Station Network | <a href="https://github.com/chriswalkerbrown/LoEco" target="_blank">GitHub</a></footer>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script>
    const BASE_URL='../..';let currentChart=null;
    const stationId=window.location.pathname.match(/stations\/([^\/]+)/)?.[1]||null;
    if(!stationId){document.body.innerHTML='<div style="padding:2rem;">Error: No station ID found in URL</div>';}
    function parseGeneratedUtc(s){if(!s||s==='—')return null;try{return new Date(s.replace(' UTC','Z').replace(' ','T'));}catch{return null;}}
    function relativeTime(d){const m=Math.round((Date.now()-d.getTime())/60000);if(m<2)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago';}
    function wbgtFlag(w){if(w==null)return{text:'—',class:'limited'};if(w<21)return{text:'Safe',class:'safe'};if(w<26)return{text:'Limited',class:'limited'};if(w<29)return{text:'Caution',class:'caution'};if(w<32)return{text:'Danger',class:'danger'};return{text:'Extreme',class:'extreme'};}
    function icon(t){const i={temperature:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C10.9 2 10 2.9 10 4v9c0 1.66-1.34 3-3 3s-3-1.34-3-3V4c0-1.1-.9-2-2-2S0 2.9 0 4v9c0 3.86 3.14 7 7 7s7-3.14 7-7V4c0-1.1-.9-2-2-2z"/></svg>',humidity:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.32 0z"/></svg>',pressure:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>',wind:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11.42 6.5H5a2 2 0 0 0 0 4h6.5a2 2 0 0 1 0 4H9.5a2 2 0 0 0-1.5 3.5 2 2 0 0 0 2 .5h8"/></svg>',rain:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>',battery:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/></svg>',wbgt:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>'};return i[t]||i.temperature;}
    async function loadDashboard(){
      try{
        const res=await fetch(`${BASE_URL}/stations/${stationId}/statistics.json`);
        if(!res.ok)throw new Error(`Failed to load station data (${res.status})`);
        const station=await res.json();
        document.getElementById('station-name').textContent=station.display_name||stationId;
        document.title=`${station.display_name||stationId} — LoEco Dashboard`;
        const lu=parseGeneratedUtc(station.generated_utc);
        if(lu){
          const dm=(Date.now()-lu.getTime())/60000,sb=document.getElementById('stale-banner'),sm=document.getElementById('stale-message');
          if(dm>90){sb.classList.add('active');if(dm>180){sb.classList.add('critical');sm.textContent=`Data missing for ${Math.round(dm/60)}+ hours`;}else{sb.classList.add('warning');sm.textContent=`No data for ${Math.round(dm)} minutes`;}}
          document.getElementById('last-update').textContent=`Updated: ${relativeTime(lu)}`;
        }
        const metrics=station.metrics||{},mg=document.getElementById('metrics-grid');
        [{key:'temperature_c',label:'Temperature',unit:'°C',icon:'temperature'},{key:'wbgt_c',label:'WBGT',unit:'°C',icon:'wbgt',special:'wbgt'},{key:'humidity_pct',label:'Humidity',unit:'%',icon:'humidity'},{key:'pressure_hpa',label:'Pressure',unit:'hPa',icon:'pressure'},{key:'wind_speed_ms',label:'Wind',unit:'m/s',icon:'wind'},{key:'rain_rate_mmhr',label:'Rain rate',unit:'mm/h',icon:'rain'},{key:'battery_voltage_v',label:'Battery',unit:'V',icon:'battery',precision:2}].forEach(m=>{
          const v=metrics[m.key]?.latest;if(v==null)return;
          const c=document.createElement('div');c.className='metric-card';
          const dv=parseFloat(v).toFixed(m.precision||1);
          let fh='';if(m.special==='wbgt'){const f=wbgtFlag(v);fh=`<div class="wbgt-flag ${f.class}">${f.text}</div>`;}
          c.innerHTML=`<div class="metric-header"><span class="metric-label"><span class="metric-icon">${icon(m.icon)}</span>${m.label}</span></div><div class="metric-value">${dv}<span class="metric-unit">${m.unit}</span></div>${fh}`;
          mg.appendChild(c);
        });
        const cr=await fetch(`${BASE_URL}/stations/${stationId}/chart_data.json`);
        if(!cr.ok)throw new Error(`Failed to load chart data (${cr.status})`);
        const cd=await cr.json();
        function fdr(range){
          const now=Date.now(),cut=range==='7d'?7*24*60:range==='3d'?72*60:24*60;
          const ts=cd.temperature_c?.timestamps||[],rw=cd.temperature_c?.raw||[],fl=[];
          ts.forEach((t,i)=>{const d=parseGeneratedUtc(t);if(d&&(now-d.getTime())/60000<=cut)fl.push({generated_utc:t,temperature_c:rw[i]});});
          return fl;
        }
        function renderChart(range){
          const data=fdr(range);
          const labels=data.map(r=>{const d=parseGeneratedUtc(r.generated_utc);return d?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'—';});
          const temps=data.map(r=>r.temperature_c!=null?parseFloat(r.temperature_c):null);
          const vt=temps.filter(t=>t!==null);
          const tMin=vt.length?Math.min(...vt)-2:0,tMax=vt.length?Math.max(...vt)+2:40;
          const ctx=document.getElementById('chart').getContext('2d');
          if(currentChart)currentChart.destroy();
          currentChart=new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Temperature (°C)',data:temps,borderColor:'#45b7d1',backgroundColor:'rgba(69,183,209,0.1)',borderWidth:2,fill:true,tension:0.4,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8888aa',font:{family:"'JetBrains Mono'"}}}},scales:{y:{beginAtZero:false,suggestedMin:tMin,suggestedMax:tMax,ticks:{color:'#8888aa'},grid:{color:'rgba(37,37,85,0.3)'}},x:{ticks:{color:'#8888aa',maxTicksLimit:12,autoSkip:true,maxRotation:0,minRotation:0},grid:{color:'rgba(37,37,85,0.3)'}}}}});
        }
        renderChart('24h');
        document.querySelectorAll('.btn-range').forEach(b=>{b.addEventListener('click',e=>{document.querySelectorAll('.btn-range').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');renderChart(e.target.dataset.range);});});
      }catch(err){console.error('Dashboard error:',err);document.getElementById('metrics-grid').innerHTML=`<div style="color:var(--accent-red);">Error loading dashboard: ${err.message}</div>`;}
    }
    loadDashboard();
  </script>
</body>
</html>
