<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>LoEco — Station Dashboard</title><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Inter:wght@400;600&display=swap" rel="stylesheet"><style>:root{--bg:#0a0a1a;--bg2:#111128;--card:#161637;--border:#252555;--txt:#e8e8f0;--muted:#8888aa;--dim:#555577;--blue:#45b7d1;--green:#4ecdc4;--red:#ff6b6b;--r:12px;--rs:8px}*{margin:0;padding:0;box-sizing:border-box}body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;line-height:1.5}body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(69,183,209,.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(78,205,196,.03) 0%,transparent 50%);pointer-events:none;z-index:0}.header{position:relative;z-index:1;background:var(--bg2);border-bottom:1px solid var(--border);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem}.header-left{display:flex;align-items:center;gap:1rem}.logo{background:linear-gradient(135deg,var(--blue),var(--green));color:#000;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:.7rem;letter-spacing:.12em;padding:.3rem .65rem;border-radius:6px;text-transform:uppercase}.bc{font-size:.9rem;font-weight:500;color:var(--txt)}.bc a{color:var(--blue);text-decoration:none}.bc a:hover{opacity:.7}.bc span{color:var(--muted);margin:0 .4rem}.header-right{display:flex;align-items:center;gap:1rem;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.75rem}.trt{display:flex;gap:.2rem;background:var(--card);border:1px solid var(--border);border-radius:var(--rs);padding:.3rem}.trt button{padding:.3rem .8rem;border:none;background:transparent;color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:600;cursor:pointer;border-radius:4px;transition:all .2s;text-transform:uppercase;letter-spacing:.04em}.trt button:hover{color:var(--txt)}.trt button.active{background:linear-gradient(135deg,var(--blue),var(--green));color:#000;font-weight:700}.stale{position:relative;z-index:1;background:var(--bg2);border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:.6rem 2rem;display:none;align-items:center;font-size:.85rem;color:var(--muted);gap:.8rem}.stale.active{display:flex}.stale.warning{background:rgba(249,202,36,.08);border-color:#f9ca24;color:#f9ca24}.stale.critical{background:rgba(255,107,107,.08);border-color:var(--red);color:var(--red)}.container{position:relative;z-index:1;max-width:1400px;margin:0 auto;padding:2rem}.mg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1.5rem;margin-bottom:2rem}.mc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:1.5rem;transition:all .3s}.mc:hover{border-color:var(--blue);box-shadow:0 0 20px rgba(69,183,209,.15)}.mh{display:flex;align-items:center;margin-bottom:.8rem}.ml{display:flex;align-items:center;gap:.5rem;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.mi{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--green)}.mv{font-family:'JetBrains Mono',monospace;font-size:2.2rem;font-weight:700;color:var(--txt);line-height:1;margin-bottom:.4rem}.mu{font-size:.9rem;color:var(--muted);font-weight:400;margin-left:.3rem}.wf{display:inline-block;padding:.35rem .75rem;border-radius:6px;font-family:'JetBrains Mono',monospace;font-size:.7rem;font-weight:700;text-transform:uppercase;margin-top:.5rem;color:#000}.wf.safe{background:#4ecdc4}.wf.limited{background:#f9ca24}.wf.caution{background:#ff9800}.wf.danger{background:#ff6b6b}.wf.extreme{background:#e74c3c;color:#fff}.cs{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:2rem;margin-bottom:2rem}.cs h2{font-size:1.1rem;font-weight:600;margin-bottom:1.5rem;color:var(--txt)}#chart{width:100%;height:400px}.footer{position:relative;z-index:1;text-align:center;padding:2rem;font-size:.75rem;color:var(--dim);border-top:1px solid var(--border);margin-top:4rem}.footer a{color:var(--blue);text-decoration:none}</style></head><body><div class="stale" id="sb"><span>⚠</span><span id="sm">No data for 90+ minutes</span></div><header class="header"><div class="header-left"><div class="logo">LoEco</div><nav class="bc"><a href="../../index.html">Dashboard</a><span>›</span><span id="sn">—</span></nav></div><div class="header-right"><div class="trt"><button class="btn-range active" data-range="24h">24H</button><button class="btn-range" data-range="3d">3D</button><button class="btn-range" data-range="7d">7D</button></div><span id="lu">Updated: —</span></div></header><div class="container"><div class="mg" id="mg"></div><div class="cs"><h2>Temperature Trend (Selected Range)</h2><canvas id="chart"></canvas></div></div><footer class="footer">LoEco Weather Station Network | <a href="https://github.com/chriswalkerbrown/LoEco" target="_blank">GitHub</a></footer><script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script><script>const B='../..';let cc=null;const sid=window.location.pathname.match(/stations\/([^\/]+)/)?.[1]||null;if(!sid){document.body.innerHTML='<div style="padding:2rem">Error: No station ID</div>';}function pu(s){if(!s||s==='—')return null;try{return new Date(s.replace(' UTC','Z').replace(' ','T'));}catch{return null;}}function rt(d){const m=Math.round((Date.now()-d.getTime())/60000);if(m<2)return 'just now';if(m<60)return m+' min ago';const h=Math.round(m/60);if(h<24)return h+'h ago';return Math.round(h/24)+'d ago';}function wflag(w){if(w==null)return{t:'—',c:'limited'};if(w<21)return{t:'Safe',c:'safe'};if(w<26)return{t:'Limited',c:'limited'};if(w<29)return{t:'Caution',c:'caution'};if(w<32)return{t:'Danger',c:'danger'};return{t:'Extreme',c:'extreme'};}const IC={temperature:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C10.9 2 10 2.9 10 4v9c0 1.66-1.34 3-3 3s-3-1.34-3-3V4c0-1.1-.9-2-2-2S0 2.9 0 4v9c0 3.86 3.14 7 7 7s7-3.14 7-7V4c0-1.1-.9-2-2-2z"/></svg>',humidity:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.32 0z"/></svg>',pressure:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>',wind:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11.42 6.5H5a2 2 0 0 0 0 4h6.5a2 2 0 0 1 0 4H9.5a2 2 0 0 0-1.5 3.5 2 2 0 0 0 2 .5h8"/></svg>',rain:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>',battery:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/></svg>',wbgt:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>'};async function load(){try{const r=await fetch(`${B}/stations/${sid}/statistics.json`);if(!r.ok)throw new Error(r.status);const s=await r.json();document.getElementById('sn').textContent=s.display_name||sid;document.title=`${s.display_name||sid} — LoEco Dashboard`;const lu=pu(s.generated_utc);if(lu){const dm=(Date.now()-lu.getTime())/60000,sb=document.getElementById('sb'),sm=document.getElementById('sm');if(dm>90){sb.classList.add('active');if(dm>180){sb.classList.add('critical');sm.textContent=`Data missing for ${Math.round(dm/60)}+ hours`;}else{sb.classList.add('warning');sm.textContent=`No data for ${Math.round(dm)} minutes`;}}document.getElementById('lu').textContent=`Updated: ${rt(lu)}`;}const mx=s.metrics||{},mg=document.getElementById('mg');[{k:'temperature_c',l:'Temperature',u:'°C',i:'temperature'},{k:'wbgt_c',l:'WBGT',u:'°C',i:'wbgt',sp:'wbgt'},{k:'humidity_pct',l:'Humidity',u:'%',i:'humidity'},{k:'pressure_hpa',l:'Pressure',u:'hPa',i:'pressure'},{k:'wind_speed_ms',l:'Wind',u:'m/s',i:'wind'},{k:'rain_rate_mmhr',l:'Rain rate',u:'mm/h',i:'rain'},{k:'battery_voltage_v',l:'Battery',u:'V',i:'battery',p:2}].forEach(m=>{const v=mx[m.k]?.latest;if(v==null)return;const c=document.createElement('div');c.className='mc';const dv=parseFloat(v).toFixed(m.p||1);let fh='';if(m.sp==='wbgt'){const f=wflag(v);fh=`<div class=\"wf ${f.c}\">${f.t}</div>`;}c.innerHTML=`<div class=\"mh\"><span class=\"ml\"><span class=\"mi\">${IC[m.i]||IC.temperature}</span>${m.l}</span></div><div class=\"mv\">${dv}<span class=\"mu\">${m.u}</span></div>${fh}`;mg.appendChild(c);});const cr=await fetch(`${B}/stations/${sid}/chart_data.json`);if(!cr.ok)throw new Error('chart '+cr.status);const cd=await cr.json();function fdr(range){const now=Date.now(),cut=range==='7d'?7*24*60:range==='3d'?72*60:24*60,ts=cd.temperature_c?.timestamps||[],rw=cd.temperature_c?.raw||[],fl=[];ts.forEach((t,i)=>{const d=pu(t);if(d&&(now-d.getTime())/60000<=cut)fl.push({t,v:rw[i]});});return fl;}function rc(range){const data=fdr(range),labels=data.map(r=>{const d=pu(r.t);return d?d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'?';}),temps=data.map(r=>r.v!=null?parseFloat(r.v):null),vt=temps.filter(t=>t!==null),tMin=vt.length?Math.min(...vt)-2:0,tMax=vt.length?Math.max(...vt)+2:40,ctx=document.getElementById('chart').getContext('2d');if(cc)cc.destroy();cc=new Chart(ctx,{type:'line',data:{labels,datasets:[{label:'Temperature (°C)',data:temps,borderColor:'#45b7d1',backgroundColor:'rgba(69,183,209,0.1)',borderWidth:2,fill:true,tension:0.4,pointRadius:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8888aa',font:{family:\"'JetBrains Mono'\"}}}},scales:{y:{beginAtZero:false,suggestedMin:tMin,suggestedMax:tMax,ticks:{color:'#8888aa'},grid:{color:'rgba(37,37,85,0.3)'}},x:{ticks:{color:'#8888aa',maxTicksLimit:12,autoSkip:true,maxRotation:0,minRotation:0},grid:{color:'rgba(37,37,85,0.3)'}}}}});}rc('24h');document.querySelectorAll('.btn-range').forEach(b=>{b.addEventListener('click',e=>{document.querySelectorAll('.btn-range').forEach(x=>x.classList.remove('active'));e.target.classList.add('active');rc(e.target.dataset.range);});});}catch(e){console.error(e);document.getElementById('mg').innerHTML=`<div style=\"color:var(--red)\">Error: ${e.message}</div>`;}}load();</script></body></html>
