<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LoEco — Station Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===========================================================
       LoEco Dashboard — DivumWX-inspired dark theme
       =========================================================== */
    :root {
      --bg-primary:   #0a0a1a;
      --bg-secondary: #111128;
      --bg-card:      #161637;
      --bg-card-alt:  #1a1a3e;
      --border:       #252555;
      --border-glow:  rgba(100, 100, 255, 0.08);
      --text-primary: #e8e8f0;
      --text-muted:   #8888aa;
      --text-dim:     #555577;
      --accent-blue:  #45b7d1;
      --accent-green: #4ecdc4;
      --accent-red:   #ff6b6b;
      --radius:       12px;
      --radius-sm:    8px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(69, 183, 209, 0.04) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(78, 205, 196, 0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 80%, rgba(255, 107, 107, 0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    .header {
      position: relative;
      z-index: 1;
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .logo-badge {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
      color: #000;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .nav-breadcrumb {
      font-family: 'Inter', sans-serif;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-primary);
    }
    .nav-breadcrumb a {
      color: var(--accent-blue);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .nav-breadcrumb a:hover { opacity: 0.7; }
    .nav-breadcrumb span { color: var(--text-muted); margin: 0 0.4rem; }

    .header-right {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
    }

    .last-update {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    /* -- Time range toggle -------------------------------------- */
    .time-range-toggle {
      display: flex;
      gap: 0.2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0.3rem;
    }
    .time-range-toggle button {
      padding: 0.3rem 0.8rem;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .time-range-toggle button:hover {
      color: var(--text-primary);
    }
    .time-range-toggle button.active {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-green));
      color: #000;
      font-weight: 700;
    }

    /* -- Stale data warning banner ------------------------------ */
    .stale-data-banner {
      position: relative;
      z-index: 1;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 0.6rem 2rem;
      display: none;
      align-items: center;
      gap: 0.6rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: var(--text-muted);
      gap: 0.8rem;
    }
    .stale-data-banner.active {
      display: flex;
    }
    .stale-data-banner.warning {
      background: rgba(249, 202, 36, 0.08);
      border-top-color: #f9ca24;
      border-bottom-color: #f9ca24;
      color: #f9ca24;
    }
    .stale-data-banner.critical {
      background: rgba(255, 107, 107, 0.08);
      border-top-color: var(--accent-red);
      border-bottom-color: var(--accent-red);
      color: var(--accent-red);
    }
    .stale-data-banner .icon {
      font-size: 1.1rem;
      flex-shrink: 0;
    }
    .stale-data-banner .message {
      flex: 1;
    }

    /* -- Main content ------------------------------------------- */
    .container {
      position: relative;
      z-index: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 2rem;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .metric-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      transition: all 0.3s ease;
    }
    .metric-card:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 0 20px rgba(69, 183, 209, 0.15);
    }

    .metric-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.8rem;
    }
    .metric-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .metric-icon {
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-green);
    }

    .metric-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-primary);
      line-height: 1;
      margin-bottom: 0.4rem;
    }
    .metric-unit {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 400;
      margin-left: 0.3rem;
    }

    .metric-meta {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--text-dim);
      line-height: 1.4;
    }
    .metric-meta-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 0.3rem;
    }

    /* -- WBGT Heat Stress Flags --------------------------------- */
    .wbgt-flag {
      display: inline-block;
      padding: 0.35rem 0.75rem;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-top: 0.5rem;
      color: #000;
    }
    .wbgt-flag.safe {
      background: #4ecdc4;
    }
    .wbgt-flag.limited {
      background: #f9ca24;
    }
    .wbgt-flag.caution {
      background: #ff9800;
    }
    .wbgt-flag.danger {
      background: #ff6b6b;
    }
    .wbgt-flag.extreme {
      background: #e74c3c;
      color: #fff;
    }

    /* -- Chart section ------------------------------------------ */
    .chart-section {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .chart-section h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
    }

    #chart {
      width: 100%;
      height: 400px;
    }

    /* -- Footer ------------------------------------------------- */
    .footer {
      position: relative;
      z-index: 1;
      text-align: center;
      padding: 2rem;
      font-size: 0.75rem;
      color: var(--text-dim);
      border-top: 1px solid var(--border);
      margin-top: 4rem;
    }
    .footer a {
      color: var(--accent-blue);
      text-decoration: none;
    }
    .footer a:hover { opacity: 0.7; }
  </style>
</head>
<body>

  <!-- Stale data warning banner -->
  <div class="stale-data-banner" id="stale-banner">
    <span class="icon">⚠</span>
    <span class="message" id="stale-message">No data for 90+ minutes</span>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo-badge">LoEco</div>
      <nav class="nav-breadcrumb">
        <a href="../index.html">Dashboard</a>
        <span>›</span>
        <span id="station-name">—</span>
      </nav>
    </div>
    <div class="header-right">
      <div class="time-range-toggle">
        <button class="btn-range active" data-range="24h">24H</button>
        <button class="btn-range" data-range="3d">3D</button>
        <button class="btn-range" data-range="7d">7D</button>
      </div>
      <span class="last-update" id="last-update">Updated: —</span>
    </div>
  </header>

  <!-- Main content -->
  <div class="container">
    <!-- Metrics grid -->
    <div class="metrics-grid" id="metrics-grid">
      <!-- Filled by JavaScript -->
    </div>

    <!-- Chart section -->
    <div class="chart-section">
      <h2>Temperature Trend (Selected Range)</h2>
      <div id="chart"></div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    LoEco Weather Station Network | <a href="https://github.com/chriswalkerbrown/LoEco" target="_blank">GitHub</a>
  </footer>

  <!-- Chart library (Chart.js) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <script>
    // =========================================================
    // LoEco Dashboard — Station detail page
    // =========================================================

    const BASE_URL = '../..';
    let currentChart = null;

    // Parse station ID from URL
    const stationId = window.location.pathname.match(/stations\/([^\/]+)/)?.[1] || null;
    if (!stationId) {
      document.body.innerHTML = '<div style="padding:2rem;">Error: No station ID found in URL</div>';
    }

    // ---- Time helpers ----------------------------------------
    function parseGeneratedUtc(str) {
      if (!str || str === '—') return null;
      try {
        return new Date(str.replace(' UTC', 'Z').replace(' ', 'T'));
      } catch { return null; }
    }

    function relativeTime(date) {
      const diffMs = Date.now() - date.getTime();
      const diffMin = Math.round(diffMs / 60000);
      if (diffMin < 2)  return 'just now';
      if (diffMin < 60) return `${diffMin} min ago`;
      const diffH = Math.round(diffMin / 60);
      if (diffH < 24)   return `${diffH}h ago`;
      return `${Math.round(diffH / 24)}d ago`;
    }

    // ---- WBGT Heat Stress Classification ----------------------
    function wbgtFlag(wbgt) {
      if (wbgt == null) return { text: '—', class: 'limited' };
      if (wbgt < 21)   return { text: 'Safe', class: 'safe' };
      if (wbgt < 26)   return { text: 'Limited', class: 'limited' };
      if (wbgt < 29)   return { text: 'Caution', class: 'caution' };
      if (wbgt < 32)   return { text: 'Danger', class: 'danger' };
      return { text: 'Extreme', class: 'extreme' };
    }

    // ---- SVG metric icons --------------------------------
    function createMetricIcon(metricType) {
      const icons = {
        'temperature': '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C10.9 2 10 2.9 10 4v9c0 1.66-1.34 3-3 3s-3-1.34-3-3V4c0-1.1-.9-2-2-2S0 2.9 0 4v9c0 3.86 3.14 7 7 7s7-3.14 7-7V4c0-1.1-.9-2-2-2zm0 0h0z"/></svg>',
        'humidity': '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.32 0z"/></svg>',
        'pressure': '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="10"/></svg>',
        'wind': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11.42 6.5H5a2 2 0 0 0 0 4h6.5a2 2 0 0 1 0 4H9.5a2 2 0 0 0-1.5 3.5 2 2 0 0 0 2 .5h8"/></svg>',
        'rain': '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>',
        'battery': '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="6" width="20" height="12" rx="2"/><line x1="6" y1="10" x2="6" y2="14"/><line x1="10" y1="10" x2="10" y2="14"/><line x1="14" y1="10" x2="14" y2="14"/></svg>',
        'wbgt': '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>',
      };
      return icons[metricType] || icons['temperature'];
    }

    // ---- Load dashboard data --------------------------------
    async function loadDashboard() {
      try {
        // Fetch station data
        const res = await fetch(`${BASE_URL}/stations/${stationId}/data.json`);
        if (!res.ok) throw new Error(`Failed to load station data (${res.status})`);
        const station = await res.json();

        // Update header
        document.getElementById('station-name').textContent = station.display_name || stationId;
        document.title = `${station.display_name || stationId} — LoEco Dashboard`;

        // ---- Check for stale data (>90 min) ----
        const lastUpdateDate = parseGeneratedUtc(station.last_update);
        if (lastUpdateDate) {
          const diffMs = Date.now() - lastUpdateDate.getTime();
          const diffMin = diffMs / 60000;
          const staleBanner = document.getElementById('stale-banner');
          const staleMsg = document.getElementById('stale-message');
          if (diffMin > 90) {
            staleBanner.classList.add('active');
            if (diffMin > 180) {
              staleBanner.classList.add('critical');
              staleMsg.textContent = `Data missing for ${Math.round(diffMin / 60)}+ hours`;
            } else {
              staleBanner.classList.add('warning');
              staleMsg.textContent = `No data for ${Math.round(diffMin)} minutes`;
            }
          }
        }

        // Update last update time
        if (lastUpdateDate) {
          document.getElementById('last-update').textContent = `Updated: ${relativeTime(lastUpdateDate)}`;
        }

        // ---- Render metric cards ----
        const metrics = station.metrics || {};
        const metricsGrid = document.getElementById('metrics-grid');
        const metricsList = [
          { key: 'temperature_c', label: 'Temperature', unit: '°C', icon: 'temperature' },
          { key: 'wbgt_c', label: 'WBGT', unit: '°C', icon: 'wbgt', special: 'wbgt' },
          { key: 'humidity_pct', label: 'Humidity', unit: '%', icon: 'humidity' },
          { key: 'pressure_hpa', label: 'Pressure', unit: 'hPa', icon: 'pressure' },
          { key: 'wind_speed_ms', label: 'Wind', unit: 'm/s', icon: 'wind' },
          { key: 'rain_rate_mmhr', label: 'Rain rate', unit: 'mm/h', icon: 'rain' },
          { key: 'battery_voltage_v', label: 'Battery', unit: 'V', icon: 'battery', precision: 2 },
        ];

        metricsList.forEach(m => {
          const value = metrics[m.key];
          if (value == null) return;

          const card = document.createElement('div');
          card.className = 'metric-card';
          const iconHtml = createMetricIcon(m.icon);
          const precision = m.precision || 1;
          const displayValue = parseFloat(value).toFixed(precision);
          let flagHtml = '';
          if (m.special === 'wbgt') {
            const flag = wbgtFlag(value);
            flagHtml = `<div class="wbgt-flag ${flag.class}">${flag.text}</div>`;
          }
          card.innerHTML = `
            <div class="metric-header">
              <span class="metric-label">
                <span class="metric-icon">${iconHtml}</span>
                ${m.label}
              </span>
            </div>
            <div class="metric-value">${displayValue}<span class="metric-unit">${m.unit}</span></div>
            ${flagHtml}
          `;
          metricsGrid.appendChild(card);
        });

        // ---- Load time-series data and render chart ----
        const histRes = await fetch(`${BASE_URL}/stations/${stationId}/history.json`);
        if (!histRes.ok) throw new Error(`Failed to load history data (${histRes.status})`);
        const history = await histRes.json();

        // Prepare chart data
        function filterDataByRange(range) {
          const now = Date.now();
          let cutoff;
          if (range === '24h') cutoff = 24 * 60;
          else if (range === '3d') cutoff = 72 * 60;
          else if (range === '7d') cutoff = 7 * 24 * 60;
          else cutoff = 24 * 60;

          const filtered = [];
          (history.readings || []).forEach(reading => {
            const readingDate = parseGeneratedUtc(reading.generated_utc);
            if (readingDate) {
              const diffMs = now - readingDate.getTime();
              const diffMin = diffMs / 60000;
              if (diffMin <= cutoff) {
                filtered.push(reading);
              }
            }
          });
          return filtered.reverse();
        }

        function renderChart(range) {
          const data = filterDataByRange(range);
          const labels = data.map(r => {
            const d = parseGeneratedUtc(r.generated_utc);
            return d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '—';
          });
          const temps = data.map(r => r.temperature_c != null ? parseFloat(r.temperature_c) : null);

          const ctx = document.getElementById('chart').getContext('2d');
          if (currentChart) currentChart.destroy();
          currentChart = new Chart(ctx, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [{
                label: 'Temperature (°C)',
                data: temps,
                borderColor: '#45b7d1',
                backgroundColor: 'rgba(69, 183, 209, 0.1)',
                borderWidth: 2,
                fill: true,
                tension: 0.4,
                pointRadius: 3,
                pointBackgroundColor: '#45b7d1',
                pointBorderColor: '#45b7d1',
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              plugins: {
                legend: {
                  labels: { color: '#8888aa', font: { family: "'JetBrains Mono'" } }
                }
              },
              scales: {
                y: {
                  beginAtZero: false,
                  ticks: { color: '#8888aa' },
                  grid: { color: 'rgba(37, 37, 85, 0.3)' }
                },
                x: {
                  ticks: { color: '#8888aa' },
                  grid: { color: 'rgba(37, 37, 85, 0.3)' }
                }
              }
            }
          });
        }

        // Initial render
        renderChart('24h');

        // ---- Time range toggle event listener ----
        document.querySelectorAll('.btn-range').forEach(btn => {
          btn.addEventListener('click', (e) => {
            document.querySelectorAll('.btn-range').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            renderChart(e.target.dataset.range);
          });
        });

      } catch (err) {
        console.error('Dashboard error:', err);
        document.getElementById('metrics-grid').innerHTML = `<div style="color:var(--accent-red);">Error loading dashboard: ${err.message}</div>`;
      }
    }

    loadDashboard();
  </script>
</body>
</html>
